<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#1d2021" />
  <meta name="description" content="Sai Reader · a lightweight local-first Markdown reader" />
  <title>Sai Reader</title>
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="stylesheet" href="vendor/katex.min.css" />
  <link rel="stylesheet" href="vendor/hljs-atom-one-dark.min.css" />
  <link rel="stylesheet" href="app.css" />
  <script src="vendor/marked.min.js" defer></script>
  <script src="vendor/katex.min.js" defer></script>
  <script src="vendor/auto-render.min.js" defer></script>
  <script src="vendor/highlight.min.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body data-theme="dark">
  <!-- SVG icon sprite（统一线性图标 · 跟随 color） -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-side" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="9" y1="3" x2="9" y2="21" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-side-off" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><line x1="9" y1="3" x2="9" y2="21" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2 2"/><line x1="14" y1="12" x2="18" y2="12" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-tree" viewBox="0 0 24 24"><path d="M3 6h6l2 2h10v11H3z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M7 11h4M7 14h4M7 17h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><line x1="8" y1="6" x2="20" y2="6" stroke="currentColor" stroke-width="1.7"/><line x1="8" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1.7"/><line x1="8" y1="18" x2="20" y2="18" stroke="currentColor" stroke-width="1.7"/><circle cx="5" cy="6" r="1" fill="currentColor"/><circle cx="5" cy="12" r="1" fill="currentColor"/><circle cx="5" cy="18" r="1" fill="currentColor"/></symbol>
      <symbol id="i-view" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="3" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="3" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="14" y="14" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
      <symbol id="i-more" viewBox="0 0 24 24"><circle cx="12" cy="5" r="1.6" fill="currentColor"/><circle cx="12" cy="12" r="1.6" fill="currentColor"/><circle cx="12" cy="19" r="1.6" fill="currentColor"/></symbol>
      <symbol id="i-caret" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 012-2h4l2 2h8a2 2 0 012 2v8a2 2 0 01-2 2H5a2 2 0 01-2-2z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
      <symbol id="i-file" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 3v4h4M9 12h6M9 16h6M9 8h2" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></symbol>
      <symbol id="i-undo" viewBox="0 0 24 24"><path d="M9 8L4 13l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 13h11a5 5 0 015 5v1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-redo" viewBox="0 0 24 24"><path d="M15 8l5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 13H9a5 5 0 00-5 5v1" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-edit" viewBox="0 0 24 24"><path d="M16 4l4 4-10 10H6v-4z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M14 6l4 4" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-save" viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M8 3v5h7V3M8 21v-7h8v7" stroke="currentColor" stroke-width="1.6" fill="none" stroke-linejoin="round"/></symbol>
      <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 3l2.7 5.7 6.3.9-4.5 4.4 1 6.3L12 17.8 6.5 20.3l1-6.3L3 9.6l6.3-.9z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
      <symbol id="i-star-fill" viewBox="0 0 24 24"><path d="M12 3l2.7 5.7 6.3.9-4.5 4.4 1 6.3L12 17.8 6.5 20.3l1-6.3L3 9.6l6.3-.9z" fill="currentColor"/></symbol>
      <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 10-2.5 5.7L20 14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 4v6h-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><g stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><line x1="12" y1="2" x2="12" y2="5"/><line x1="12" y1="19" x2="12" y2="22"/><line x1="2" y1="12" x2="5" y2="12"/><line x1="19" y1="12" x2="22" y2="12"/><line x1="5" y1="5" x2="7" y2="7"/><line x1="17" y1="17" x2="19" y2="19"/><line x1="5" y1="19" x2="7" y2="17"/><line x1="17" y1="7" x2="19" y2="5"/></g></symbol>
      <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14a8 8 0 11-9-11 7 7 0 009 11z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></symbol>
      <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 12h2M10 12h10M4 17h14M20 17h0" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><circle cx="16" cy="7" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="8" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="18" cy="17" r="2" fill="none" stroke="currentColor" stroke-width="1.7"/></symbol>
      <symbol id="i-min" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-max" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-restore" viewBox="0 0 24 24"><rect x="5" y="7" width="14" height="13" rx="1" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 7V5h11v13" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
      <symbol id="i-close" viewBox="0 0 24 24"><line x1="6" y1="6" x2="18" y2="18" stroke="currentColor" stroke-width="1.7"/><line x1="18" y1="6" x2="6" y2="18" stroke="currentColor" stroke-width="1.7"/></symbol>
      <symbol id="i-back" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
      <symbol id="i-map" viewBox="0 0 24 24"><path d="M6 3v18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/><circle cx="6" cy="5" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="6" cy="12" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="6" cy="19" r="2.2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M9.5 5H21M9.5 12h7M9.5 19h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></symbol>
      <symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M7 9h10M7 12.5h7M7 16h4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/><path d="M17.8 7.2l.6-1.2.6 1.2 1.2.6-1.2.6-.6 1.2-.6-1.2-1.2-.6z" fill="currentColor"/></symbol>
      <symbol id="i-glass" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 10h16" stroke="currentColor" stroke-width="1.4" opacity=".7"/><circle cx="15.5" cy="16" r="2.4" fill="currentColor" opacity=".85"/></symbol>
    </defs>
  </svg>

  <header class="topbar">
    <div class="tabbar" id="tabBar" hidden></div>
    <nav class="actions" id="actions">
      <!-- 抽屉触发组：仅图标/仅文字双模式，缩窗溢出自动进 ⋮ 更多抽屉 -->
      <button id="tbFile" class="tb-btn" data-drawer="menuFile" data-overflow="1" title="文件"><svg class="ic"><use href="#i-folder"/></svg><span class="tb-label">文件</span><svg class="ic tb-caret"><use href="#i-caret"/></svg></button>
      <button id="tbEdit" class="tb-btn" data-drawer="menuEdit" data-overflow="1" title="编辑"><svg class="ic"><use href="#i-edit"/></svg><span class="tb-label">编辑</span><svg class="ic tb-caret"><use href="#i-caret"/></svg></button>
      <button id="tbView" class="tb-btn" data-drawer="menuView" data-overflow="1" title="视图"><svg class="ic"><use href="#i-view"/></svg><span class="tb-label">视图</span><svg class="ic tb-caret"><use href="#i-caret"/></svg></button>
      <button id="tbDoc" class="tb-btn" data-drawer="menuDoc" data-overflow="1" title="文档"><svg class="ic"><use href="#i-star"/></svg><span class="tb-label">文档</span><svg class="ic tb-caret"><use href="#i-caret"/></svg></button>
      <button id="btnTheme" class="tb-btn" data-overflow="1" title="切换深浅主题"><svg class="ic"><use href="#i-moon"/></svg><span class="tb-label">主题</span></button>
      <button id="btnSettings" class="tb-btn" data-overflow="1" title="显示设置"><svg class="ic"><use href="#i-settings"/></svg><span class="tb-label">设置</span></button>
      <button id="btnGlass" class="tb-btn" data-overflow="1" title="玻璃质感（透明度/材质）"><svg class="ic"><use href="#i-glass"/></svg><span class="tb-label">玻璃</span></button>
      <button id="tbMore" class="tb-btn" data-drawer="menuMore" title="更多功能" hidden><svg class="ic"><use href="#i-more"/></svg><span class="tb-label">更多</span><svg class="ic tb-caret"><use href="#i-caret"/></svg></button>
    </nav>
    <nav class="win-ctrl">
      <button id="btnMin" title="最小化" aria-label="最小化" class="win-btn"><svg class="ic"><use href="#i-min"/></svg></button>
      <button id="btnMax" title="最大化/还原" aria-label="最大化/还原" class="win-btn"><svg class="ic"><use href="#i-max"/></svg></button>
      <button id="btnClose" title="关闭" aria-label="关闭" class="win-btn win-close"><svg class="ic"><use href="#i-close"/></svg></button>
    </nav>
  </header>

  <!-- 下拉抽屉（文件/编辑/视图/文档/更多） -->
  <div id="menuFile" class="drawer" hidden>
    <button id="btnOpenFolder" class="menu-item"><svg class="ic"><use href="#i-folder"/></svg><span>打开文件夹</span></button>
    <button id="btnOpenFile" class="menu-item"><svg class="ic"><use href="#i-file"/></svg><span>打开文件</span></button>
  </div>
  <div id="menuEdit" class="drawer" hidden>
    <button id="btnUndo" class="menu-item" disabled><svg class="ic"><use href="#i-undo"/></svg><span>撤销</span><kbd>Ctrl+Z</kbd></button>
    <button id="btnRedo" class="menu-item" disabled><svg class="ic"><use href="#i-redo"/></svg><span>恢复</span><kbd>Ctrl+Y</kbd></button>
    <div class="drawer-sep"></div>
    <button id="btnEdit" class="menu-item" disabled><svg class="ic"><use href="#i-edit"/></svg><span>编辑文档</span></button>
    <button id="btnRefresh" class="menu-item" disabled><svg class="ic"><use href="#i-refresh"/></svg><span>从磁盘刷新</span></button>
  </div>
  <div id="menuView" class="drawer" hidden>
    <button id="btnTree" class="menu-item"><svg class="ic"><use href="#i-tree"/></svg><span>文件树</span></button>
    <button id="btnToc" class="menu-item"><svg class="ic"><use href="#i-list"/></svg><span>目录大纲</span></button>
    <button id="btnMap" class="menu-item"><svg class="ic"><use href="#i-map"/></svg><span>导读地图</span></button>
    <div class="drawer-sep"></div>
    <button id="btnSideToggle" class="menu-item"><svg class="ic"><use href="#i-side"/></svg><span>隐藏侧栏</span></button>
    <button id="btnCompact" class="menu-item"><svg class="ic"><use href="#i-list"/></svg><span>精简模式</span></button>
  </div>
  <div id="menuDoc" class="drawer" hidden>
    <button id="btnFavDoc" class="menu-item" disabled><svg class="ic"><use href="#i-star"/></svg><span>收藏本文</span></button>
    <div class="drawer-sep"></div>
    <div class="drawer-title">最近打开</div>
    <div id="docRecent" class="drawer-list"></div>
    <div class="drawer-title">收藏</div>
    <div id="docFavs" class="drawer-list"></div>
  </div>
  <div id="menuMore" class="drawer" hidden>
    <div id="docMore" class="drawer-list"></div>
  </div>

  <!-- 设置面板 -->
  <div id="settingsPanel" class="settings-panel" hidden>
    <div class="settings-header">
      <span>显示设置</span>
      <button id="btnSettingsClose" class="settings-close" aria-label="关闭设置">✕</button>
    </div>
    <div class="settings-body">
      <div class="settings-row">
        <label>标题字号</label>
        <input type="range" id="setH1Size" min="1.5" max="2.4" step="0.05" />
        <span class="settings-val" id="valH1Size">1.75em</span>
      </div>
      <div class="settings-row">
        <label>正文字号</label>
        <input type="range" id="setBodySize" min="14" max="20" step="1" />
        <span class="settings-val" id="valBodySize">16px</span>
      </div>
      <div class="settings-row">
        <label>代码字号</label>
        <input type="range" id="setCodeSize" min="12" max="16" step="1" />
        <span class="settings-val" id="valCodeSize">14px</span>
      </div>
      <div class="settings-row">
        <label>主题</label>
        <button id="setThemeDark" class="theme-btn active">深色</button>
        <button id="setThemeLight" class="theme-btn">浅色</button>
      </div>
      <div class="settings-row">
        <label>配色方案</label>
        <div id="paletteSwatches" class="palette-swatches"></div>
      </div>
      <div class="settings-row">
        <label>工具栏</label>
        <button id="setTbIcon" class="theme-btn active">仅图标</button>
        <button id="setTbText" class="theme-btn">仅文字</button>
      </div>
      <div class="settings-row">
        <label>版本</label>
        <span class="settings-val" id="settingsVer">Sai Reader</span>
      </div>
      <div class="settings-row">
        <label>侧栏宽度</label>
        <input type="range" id="setSideWidth" min="160" max="480" step="10" />
        <span class="settings-val" id="valSideWidth">260px</span>
      </div>
      <div class="settings-row settings-sub">AI 导读卡（章节卡片用小模型生成，缓存在本机）</div>
      <div class="settings-row">
        <label>网关地址</label>
        <input type="text" id="setAiEndpoint" class="set-text" placeholder="http://100.86.60.101:8317" />
      </div>
      <div class="settings-row">
        <label>API Key</label>
        <input type="password" id="setAiKey" class="set-text" placeholder="sk-…" />
      </div>
      <div class="settings-row">
        <label>模型</label>
        <input type="text" id="setAiModel" class="set-text" placeholder="minimaxai/minimax-m3" />
      </div>
    </div>
  </div>

  <!-- 玻璃质感独立面板（工具栏「玻璃」按钮直达；四路下限 1%） -->
  <div id="glassPanel" class="settings-panel" hidden>
    <div class="settings-header">
      <span>玻璃质感</span>
      <button id="btnGlassClose" class="settings-close" aria-label="关闭玻璃面板">✕</button>
    </div>
    <div class="settings-body">
      <div class="settings-row">
        <label>玻璃效果</label>
        <button id="setGlassOn" class="theme-btn active">开</button>
        <button id="setGlassOff" class="theme-btn">关</button>
      </div>
      <div class="settings-row">
        <label>材质</label>
        <select id="setGlassMaterial" class="set-select">
          <option value="none">直透</option>
          <option value="acrylic">磨砂</option>
        </select>
      </div>
      <div class="settings-row">
        <label>整窗底色</label>
        <input type="range" id="setGlassBase" min="1" max="100" step="1" />
        <span class="settings-val" id="valGlassBase">12%</span>
      </div>
      <div class="settings-row">
        <label>顶栏侧栏</label>
        <input type="range" id="setGlassChrome" min="1" max="100" step="1" />
        <span class="settings-val" id="valGlassChrome">25%</span>
      </div>
      <div class="settings-row">
        <label>正文</label>
        <input type="range" id="setGlassReader" min="1" max="100" step="1" />
        <span class="settings-val" id="valGlassReader">35%</span>
      </div>
      <div class="settings-row">
        <label>浮层</label>
        <input type="range" id="setGlassPop" min="1" max="100" step="1" />
        <span class="settings-val" id="valGlassPop">30%</span>
      </div>
      <div class="settings-row">
        <label>文字</label>
        <input type="range" id="setGlassText" min="10" max="100" step="1" />
        <span class="settings-val" id="valGlassText">100%</span>
      </div>
    </div>
  </div>

  <main class="layout" id="layout">
    <aside class="side" id="side">
      <div class="side-head" id="sideHead">
        <button id="btnBackToTree" class="back-btn" hidden><svg class="ic sm"><use href="#i-back"/></svg> 文件树</button>
      </div>
      <div class="side-scroll" id="sideScroll">
        <div id="sideBody"></div>
        <div class="side-empty" id="sideEmpty">还没有打开文件夹。<br/>点上方「文件夹」，或把 .md 文件拖进窗口。</div>
      </div>
      <div class="side-vresizer" id="sideVResizer" title="拖拽调整上下高度"></div>
      <section class="side-bottom" id="sideBottom">
        <div class="side-bottom-head"><span>最近打开</span><span id="recentCount"></span></div>
        <div class="side-bottom-list" id="recentList"></div>
      </section>
    </aside>
    <div class="side-resizer" id="sideResizer" title="拖拽调整侧栏宽度"></div>
    <section class="reader" id="reader">
      <div class="reader-inner" id="readerInner">
        <div class="empty" id="readerEmpty">
          <h2>还没有打开任何文档</h2>
          <p>轻量本地 Markdown 阅读器</p>
          <p class="empty-actions"><button type="button" id="emptyOpenFolder">打开文件夹</button> <button type="button" id="emptyOpenFile">打开文件</button></p>
          <p class="empty-hint">也可以把 .md 文件拖进窗口。</p>
        </div>
      </div>
      <textarea id="editor" class="editor" spellcheck="false" hidden></textarea>
    </section>
  </main>

  <div class="toast" id="toast" hidden></div>
</body>
</html>
