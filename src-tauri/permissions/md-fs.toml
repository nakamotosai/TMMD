[[permission]]
identifier = "allow-desktop-info"
description = "Allow desktop_info command"
commands.allow = ["desktop_info"]

[[permission]]
identifier = "allow-pick-folder"
description = "Allow pick_folder native dialog"
commands.allow = ["pick_folder"]

[[permission]]
identifier = "allow-list-md-tree"
description = "Allow list_md_tree under registered root"
commands.allow = ["list_md_tree"]

[[permission]]
identifier = "allow-read-text"
description = "Allow read_text under path cage"
commands.allow = ["read_text"]

[[permission]]
identifier = "allow-write-text"
description = "Allow write_text under path cage"
commands.allow = ["write_text"]

[[permission]]
identifier = "allow-save-path"
description = "Allow save_path single-file write"
commands.allow = ["save_path"]

[[permission]]
identifier = "allow-load-roots"
description = "Allow load_roots from app config"
commands.allow = ["load_roots"]

[[permission]]
identifier = "allow-save-roots"
description = "Allow save_roots to app config"
commands.allow = ["save_roots"]

[[permission]]
identifier = "allow-set-glass-material"
description = "Allow set_glass_material (R2 玻璃材质下拉：none/mica/acrylic + tint，aero 已删)"
commands.allow = ["set_glass_material"]

[[permission]]
identifier = "allow-get-glass-state"
description = "Allow get_glass_state (R2-fix 诊断位：直读 DWM 实时 backdrop)"
commands.allow = ["get_glass_state"]

[[permission]]
identifier = "allow-open-default-apps-settings"
description = "Allow open_default_apps_settings (文件关联按钮：打开系统默认应用设置页，不静默改默认)"
commands.allow = ["open_default_apps_settings"]

[[permission]]
identifier = "allow-get-md-default"
description = "Allow get_md_default (文件关联状态:只读 HKCU .md UserChoice ProgId)"
commands.allow = ["get_md_default"]

[[permission]]
identifier = "allow-system-effects-state"
description = "Allow system_effects_state (系统透明/高对比开关只读探针)"
commands.allow = ["system_effects_state"]

[[permission]]
identifier = "allow-watch-file"
description = "Allow watch_file (外部文件变更监听:父目录非递归 + fs-changed 事件,None 取消)"
commands.allow = ["watch_file"]

[[permission]]
identifier = "allow-search-library"
description = "Allow search_library (已登记库全文搜索,spawn_blocking 内跑)"
commands.allow = ["search_library"]

[[permission]]
identifier = "allow-export-file"
description = "Allow export_file (导出 .html/.htm 并返回绝对路径)"
commands.allow = ["export_file"]

[[permission]]
identifier = "allow-create-file"
description = "Allow create_file (囚笼内新建文档;目标已存在则拒绝)"
commands.allow = ["create_file"]

[[permission]]
identifier = "allow-rename-file"
description = "Allow rename_file (囚笼内重命名/移动;目标已存在则拒绝)"
commands.allow = ["rename_file"]

[[permission]]
identifier = "allow-delete-file"
description = "Allow delete_file (囚笼内删除:移入系统回收站,不永久删)"
commands.allow = ["delete_file"]

[[permission]]
identifier = "allow-pick-save"
description = "Allow pick_save (另存为:系统保存对话框,只回路径)"
commands.allow = ["pick_save"]

[[permission]]
identifier = "allow-allow-close"
description = "Allow allow_close (关窗守卫放行:前端确认无未保存内容后才真关)"
commands.allow = ["allow_close"]

[[permission]]
identifier = "allow-update-check"
description = "Allow update_check (自研更新器:取发布清单,24h 节流)"
commands.allow = ["update_check"]

[[permission]]
identifier = "allow-update-download"
description = "Allow update_download (下载更新包 + SHA-256 强校验)"
commands.allow = ["update_download"]

[[permission]]
identifier = "allow-update-install"
description = "Allow update_install (静默安装并重启到新版)"
commands.allow = ["update_install"]

[[permission]]
identifier = "allow-update-note"
description = "Allow update_note (记录 跳过/稍后)"
commands.allow = ["update_note"]

[[permission]]
identifier = "allow-open-any"
description = "Allow open_any (ShellExecute 打开任意文件/目录,不限扩展名)"
commands.allow = ["open_any"]
