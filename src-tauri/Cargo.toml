[package]
name = "sai-md-reader"
version = "1.3.0"
description = "Sai MD Reader desktop"
authors = ["Sai"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sai_md_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
tauri-plugin-single-instance = "2"
window-vibrancy = "0.8"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
