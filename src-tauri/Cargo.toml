[package]
name = "sai-md-reader"
version = "0.1.0"
description = "Sai MD Reader desktop"
authors = ["Sai"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sai_md_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
